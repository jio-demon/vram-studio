<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 创客智造</title>
<meta name="theme-color" content="#0f0f11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0a468'/%3E%3Crect x='13' y='8' width='6' height='16' rx='2' fill='%231c1206'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span id="brand-name">创客智造</span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>
    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="progress" id="progress" aria-hidden="true"></div>

<main id="main">

<section class="block">
  <div class="wrap">
    <div class="post-layout">
      <article class="prose" id="post"></article>
      <aside class="toc" id="toc" aria-label="本文目录"></aside>
    </div>
    <div style="margin-top:var(--sp-12)">
      <a class="btn btn-ghost" href="blog.html">← 返回笔记列表</a>
    </div>
  </div>
</section>

</main>

<button class="totop" id="totop" type="button" aria-label="回到顶部">↑</button>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 <span class="fn-brand"></span></span>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
mountNav("blog.html");
$$(".fn-brand").forEach(e => (e.textContent = SITE.name));
renderPost("#post");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记 · 显存制造</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span><span id="brand-name">显存制造</span></a>
    <nav class="nav-links" id="nav-links"></nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div class="block-head"><h2>折腾笔记</h2><span class="more" id="count"></span></div>
    <div class="filters" id="cat-filters"></div>
    <div class="post-list" id="posts"></div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 <span class="fn-brand"></span></span>
    <span>硬件 · 提示词 · 工作流 · 部署</span>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
mountNav("blog.html");
$$(".fn-brand").forEach(e => (e.textContent = SITE.name));

const cats = ["全部", ...new Set(POSTS.map(p => p.category))];
const bar = document.getElementById("cat-filters");
bar.innerHTML = cats
  .map((c, i) => `<button class="chip${i === 0 ? " active" : ""}" data-c="${c}">${c}</button>`)
  .join("");

function applyCat(c) {
  const items = c === "全部" ? POSTS : POSTS.filter(p => p.category === c);
  renderPostList("#posts", items);
  document.getElementById("count").textContent =
    items.length + (c === "全部" ? " 篇" : " 篇「" + c + "」");
}

$$(".chip", bar).forEach(chip => {
  chip.addEventListener("click", () => {
    $$(".chip", bar).forEach(x => x.classList.remove("active"));
    chip.classList.add("active");
    applyCat(chip.dataset.c);
  });
});

applyCat("全部");
</script>
</body>
</html>

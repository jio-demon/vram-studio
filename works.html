<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品 · 显存制造</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span><span id="brand-name">显存制造</span></a>
    <nav class="nav-links" id="nav-links"></nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div class="block-head"><h2>全部作品</h2><span class="more" id="count"></span></div>
    <div class="filters">
      <button class="chip active" data-f="all">全部</button>
      <button class="chip" data-f="image">图像</button>
      <button class="chip" data-f="video">视频</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>© 2026 <span class="fn-brand"></span></span>
    <span>点开任意作品可查看提示词与参数</span>
  </div>
</footer>

<div class="modal" id="modal">
  <button class="modal-close">×</button>
  <div class="modal-box" id="modal-body"></div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
mountNav("works.html");
$$(".fn-brand").forEach(e => (e.textContent = SITE.name));
renderWorks("#grid", WORKS);
document.getElementById("count").textContent = WORKS.length + " 件";
$$(".chip").forEach(c => {
  c.addEventListener("click", () => {
    $$(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    const f = c.dataset.f;
    renderWorks("#grid", f === "all" ? WORKS : WORKS.filter(w => w.type === f));
  });
});
</script>
</body>
</html>
